name: Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to bump to (e.g. 3.0.0). Only used by manual trigger.'
        required: true
        default: '3.0.0'

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  # ---------------------------------------------------------------------------
  # Quality gates. These MUST pass before any package is published or any
  # GitHub Release is created. Every downstream publish job depends on the
  # `quality-gate` aggregation job via `needs:`, so a failure in any gate
  # short-circuits the whole release: no NuGet/MyGet push, no GitHub Release.
  #
  # The gates mirror the PR CI pipeline (.github/workflows/build-pr-ci.yml) and
  # reuse the exact same coverage script (.github/scripts/check-coverage.sh)
  # so thresholds stay identical and cannot drift:
  #   Unit 95% / E2E 80% / NativeAOT Unit 100% / NativeAOT E2E 95%.
  # ---------------------------------------------------------------------------
  lint:
    name: Lint (Release gate)
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          6.0.x
          8.0.x
          9.0.x
          10.0.x
    - name: Lint (dotnet format)
      shell: bash
      run: |
        dotnet format AspectCore-Framework.sln --verify-no-changes --verbosity diagnostic

  unit-coverage:
    name: Unit Coverage (Release gate)
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          6.0.x
          8.0.x
          9.0.x
          10.0.x
    - name: Collect unit test coverage
      shell: bash
      run: |
        chmod +x ./.github/scripts/check-coverage.sh
        ./.github/scripts/check-coverage.sh collect unit --output coverage-results/unit.env
    - name: Assert unit coverage (min 95%)
      shell: bash
      run: |
        ./.github/scripts/check-coverage.sh assert unit --input coverage-results/unit.env

  e2e-coverage:
    name: E2E Coverage (Release gate)
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          6.0.x
          8.0.x
          9.0.x
          10.0.x
    - name: Collect E2E test coverage
      shell: bash
      run: |
        chmod +x ./.github/scripts/check-coverage.sh
        ./.github/scripts/check-coverage.sh collect e2e --output coverage-results/e2e.env
    - name: Assert E2E coverage (min 80%)
      shell: bash
      run: |
        ./.github/scripts/check-coverage.sh assert e2e --input coverage-results/e2e.env

  nativeaot-coverage:
    name: NativeAOT Coverage (Release gate)
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          6.0.x
          8.0.x
          9.0.x
          10.0.x
    - name: Collect NativeAOT unit coverage
      shell: bash
      run: |
        chmod +x ./.github/scripts/check-coverage.sh
        ./.github/scripts/check-coverage.sh collect nativeaot-unit --output coverage-results/nativeaot-unit.env
    - name: Collect NativeAOT E2E coverage
      shell: bash
      run: |
        ./.github/scripts/check-coverage.sh collect nativeaot-e2e --output coverage-results/nativeaot-e2e.env
    - name: Assert NativeAOT unit coverage (min 100%)
      shell: bash
      run: |
        ./.github/scripts/check-coverage.sh assert nativeaot-unit --input coverage-results/nativeaot-unit.env
    - name: Assert NativeAOT E2E coverage (min 95%)
      shell: bash
      run: |
        ./.github/scripts/check-coverage.sh assert nativeaot-e2e --input coverage-results/nativeaot-e2e.env

  nativeaot-verify:
    name: NativeAOT Publish + Run (Release gate)
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          6.0.x
          8.0.x
          9.0.x
          10.0.x
    - name: Restore dependencies
      run: dotnet restore AspectCore-Framework.sln
    - name: Build solution
      run: dotnet build AspectCore-Framework.sln -c Release --no-restore
    - name: Publish NativeAOT E2E (self-contained AOT binary)
      run: dotnet publish tests/AspectCore.NativeAot.E2E/AspectCore.NativeAot.E2E.csproj -c Release -r linux-x64 -o ./publish-aot --no-restore
    - name: Run NativeAOT E2E binary
      run: ./publish-aot/AspectCore.NativeAot.E2E

  codeql:
    name: CodeQL (Release gate)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          6.0.x
          8.0.x
          9.0.x
          10.0.x
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: csharp
    - name: Build for CodeQL
      shell: bash
      run: |
        for project in $(find ./src -name "*.csproj"); do
          dotnet build --configuration Release $project
        done
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:csharp"

  quality-gate:
    name: Quality Gate (all checks passed)
    runs-on: ubuntu-latest
    needs:
      - lint
      - unit-coverage
      - e2e-coverage
      - nativeaot-coverage
      - nativeaot-verify
      - codeql
    steps:
    - name: All quality gates passed
      run: echo "All release quality gates passed. Proceeding to package and publish."

  build-and-test:
    # Publishing is gated: this job (and therefore NuGet/MyGet push and the
    # GitHub Release created within it) only runs after every quality gate
    # succeeds. If quality-gate fails, this job is skipped and nothing ships.
    needs: quality-gate
    permissions:
      id-token: write
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          6.0.x
          8.0.x
          9.0.x
          10.0.x

    - name: Build Reason
      run: "echo ref: ${{github.ref}} event: ${{github.event_name}} os: ${{ matrix.os }}"

    - name: Extract Version from Tag
      shell: pwsh
      run: |
        # Extract version from tag: v2.4.0 -> 2.4.0, v2.4.0-preview1 -> 2.4.0-preview1
        $tag = "${{ github.ref_name }}"
        $version = $tag.TrimStart('v')
        echo "Full Version: $version"
        Add-Content -Path $Env:GITHUB_ENV -Value "FULL_VERSION=$version"

    - name: Build
      shell: bash
      run: |
        set -e
        for project in $(find ./src -name "*.csproj"); do
          dotnet build --configuration Release $project -p:Version=${{ env.FULL_VERSION }}
        done

    - name: Run Tests
      shell: bash
      run: |
        set -e
        for project in $(find ./tests -name "*.csproj"); do
          dotnet test --configuration Release $project
        done

    - name: Package
      if: matrix.os == 'windows-latest'
      shell: bash
      run: |
        set -e
        rm -rf ./artifacts/packages
        mkdir -p ./artifacts/packages
        for project in $(find ./src -name "*.csproj"); do
          dotnet pack --configuration Release --no-build $project -p:PackageVersion=${{ env.FULL_VERSION }} --output ./artifacts/packages
        done

    - name: Verify All Packages Created
      if: matrix.os == 'windows-latest'
      shell: bash
      run: |
        set -e
        echo "=== Verifying all packages were created ==="
        expected_count=$(find ./src -name "*.csproj" | wc -l)
        # Count only .nupkg files, excluding .symbols.nupkg and .snupkg
        actual_count=$(find ./artifacts/packages/ -name "*.nupkg" ! -name "*.symbols.nupkg" | wc -l)
        echo "Expected: $expected_count packages, Found: $actual_count packages"
        if [ "$actual_count" -ne "$expected_count" ]; then
          echo "ERROR: Package count mismatch! Expected $expected_count but found $actual_count"
          echo "Missing packages:"
          for project in $(find ./src -name "*.csproj"); do
            name=$(basename $(dirname $project))
            if ! find ./artifacts/packages/ -name "${name}.*.nupkg" ! -name "*.symbols.nupkg" | grep -q .; then
              echo "  MISSING: $name"
            fi
          done
          exit 1
        fi
        echo "All $actual_count packages created successfully"
        ls -la ./artifacts/packages/*.nupkg

    - name: NuGet login (OIDC → temp API key)
      if: matrix.os == 'windows-latest'
      uses: NuGet/login@v1
      id: nuget_login
      with:
        user: ${{ secrets.NUGET_USER }}

    - name: Publish Packages to NuGet.org (with retry)
      if: matrix.os == 'windows-latest'
      shell: bash
      run: |
        set -e
        echo "=== Publishing packages to NuGet.org ==="
        failed_packages=()
        for package in $(find ./artifacts/packages/ -name "*.nupkg"); do
          name=$(basename $package)
          success=false
          for attempt in 1 2 3; do
            echo "Publishing $name (attempt $attempt/3)..."
            if dotnet nuget push "$package" \
              --source "https://api.nuget.org/v3/index.json" \
              --api-key ${{ steps.nuget_login.outputs.NUGET_API_KEY }} \
              --skip-duplicate 2>&1; then
              success=true
              echo "SUCCESS: $name"
              break
            else
              echo "WARN: Failed to publish $name (attempt $attempt)"
              sleep 5
            fi
          done
          if [ "$success" = false ]; then
            echo "ERROR: Failed to publish $name after 3 attempts"
            failed_packages+=("$name")
          fi
        done

        if [ ${#failed_packages[@]} -gt 0 ]; then
          echo "=== FAILED PACKAGES ==="
          for pkg in "${failed_packages[@]}"; do
            echo "  FAILED: $pkg"
          done
          exit 1
        fi
        echo "=== All packages published successfully ==="

    - name: Publish Packages to MyGet (with retry)
      if: matrix.os == 'windows-latest'
      shell: bash
      run: |
        set -e
        echo "=== Publishing packages to MyGet ==="
        failed_packages=()
        for package in $(find ./artifacts/packages/ -name "*.nupkg" -o -name "*.snupkg"); do
          name=$(basename $package)
          success=false
          for attempt in 1 2 3; do
            echo "Pushing $name to MyGet (attempt $attempt/3)..."
            if dotnet nuget push "$package" \
              --source "https://www.myget.org/F/aspectcore/api/v2/package" \
              --api-key ${{ secrets.MYGET_API_KEY }} \
              --skip-duplicate 2>&1; then
              success=true
              echo "SUCCESS: $name"
              break
            else
              echo "WARN: Failed to push $name (attempt $attempt)"
              sleep 5
            fi
          done
          if [ "$success" = false ]; then
            echo "ERROR: Failed to push $name after 3 attempts"
            failed_packages+=("$name")
          fi
        done

        if [ ${#failed_packages[@]} -gt 0 ]; then
          echo "=== FAILED PACKAGES (MyGet) ==="
          for pkg in "${failed_packages[@]}"; do
            echo "  FAILED: $pkg"
          done
          exit 1
        fi
        echo "=== All packages published to MyGet successfully ==="

    - name: Create GitHub Release
      if: matrix.os == 'windows-latest'
      uses: softprops/action-gh-release@v2
      with:
        files: |
          artifacts/packages/*.nupkg
          artifacts/packages/*.snupkg
        generate_release_notes: true

  update-version:
    # Runs only after a successful publish (build-and-test). Combined with the
    # quality-gate chain, the version bump PR is never opened when a release
    # was blocked by a failing gate or a failed publish.
    # For tag pushes: only bump version for stable releases (not pre-releases like beta/rc/alpha)
    # For manual trigger: always run (subject to build-and-test success)
    needs: build-and-test
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Extract Version
      shell: pwsh
      run: |
        if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
          # Manual trigger: use the input version
          $version = "${{ github.event.inputs.version }}"
        } else {
          # Tag trigger: extract from tag and bump to next minor
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v')
          $parts = $version -split '\.'
          $major = $parts[0]
          $minor = $parts[1]
          $patch = ($parts[2] -split '-')[0]
          # Bump to next minor: 2.5.0 -> 2.6.0
          $version = "$major.$([int]$minor + 1).0"
        }

        $parts = $version -split '\.'
        echo "MAJOR=$($parts[0])" >> $env:GITHUB_ENV
        echo "MINOR=$($parts[1])" >> $env:GITHUB_ENV
        echo "PATCH=$($parts[2])" >> $env:GITHUB_ENV
        echo "Version to bump: $version"

    - name: Update version.props
      shell: pwsh
      run: |
        $path = "./build/version.props"
        [xml]$xml = Get-Content $path
        $xml.Project.PropertyGroup.VersionMajor = $env:MAJOR
        $xml.Project.PropertyGroup.VersionMinor = $env:MINOR
        $xml.Project.PropertyGroup.VersionPatch = $env:PATCH
        $xml.Project.PropertyGroup.VersionQuality = ""
        $xml.Save($path)
        echo "Updated version.props to $($env:MAJOR).$($env:MINOR).$($env:PATCH)"

    - name: Create PR for version bump
      uses: peter-evans/create-pull-request@v6
      with:
        base: master
        token: ${{ secrets.GITHUB_TOKEN }}
        commit-message: "chore: bump version to ${{ env.MAJOR }}.${{ env.MINOR }}.${{ env.PATCH }}"
        title: "chore: bump version to ${{ env.MAJOR }}.${{ env.MINOR }}.${{ env.PATCH }}"
        author: "github-actions[bot] <41898275+github-actions[bot]@users.noreply.github.com>"
        committer: "github-actions[bot] <41898275+github-actions[bot]@users.noreply.github.com>"
        body: |
          Auto-generated version bump.

          Updated `build/version.props` to ${{ env.MAJOR }}.${{ env.MINOR }}.${{ env.PATCH }} so that
          subsequent preview packages use the correct base version.

          Note: For patch releases (e.g. 2.6.1), update `build/version.props` manually.
        branch: chore/version-bump-${{ env.MAJOR }}.${{ env.MINOR }}.${{ env.PATCH }}
        delete-branch: true
